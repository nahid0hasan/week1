<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div>
        <h1 id="heading">Local Storage</h1>
        <input
          type="text"
          name="Username"
          id="username"
          placeholder="enter your name"
        />
        <button id="showusername">Show User Name</button>
      </div>
      <br />
      <hr />
      <div>
        <h1 id="displaytext">Display Text</h1>
        <input
          type="text"
          name="task"
          id="task"
          placeholder="tell me your next task"
        />
        <button id="store">Store</button>
        <button id="display">Display</button>
        <button id="clear">Clear</button>
      </div>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
